# ci — the maintainer's local verification pass (see README "Verify a change"), run on every PR
# and every push to main. Deterministic only: no model calls, no Claude login, no secrets.
# The Claude Code CLI is installed solely for `claude plugin validate`, which reads local files
# (its help text: "Use in CI to fail on unrecognized fields…").
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
# Cancel a superseded PR run; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is required, not a nicety: only its /bin/bash is 3.2, the version stock macOS
        # users run, and selfcheck 9k plus the parse loop below only bite there.
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs; Dependabot (.github/dependabot.yml) bumps the SHA and the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code CLI (validate only, never logged in)
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: qa-selfcheck
        run: qa-warden/bin/qa-selfcheck
      - name: qa-hooktest
        # /bin/bash on purpose: on macOS that is 3.2, the shell the hooks meet on a stock Mac.
        run: /bin/bash qa-warden/bin/qa-hooktest
      - name: Shell scripts parse
        run: |
          rc=0
          for f in $(git ls-files); do
            if head -n 1 "$f" | grep -qE '^#!.*\b(ba)?sh\b'; then
              /bin/bash -n "$f" || { echo "::error file=$f::does not parse under $(/bin/bash -c 'echo $BASH_VERSION')"; rc=1; }
            fi
          done
          exit $rc
      - name: JSON files parse
        run: |
          rc=0
          for f in $(git ls-files '*.json'); do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; rc=1; }
          done
          exit $rc
      - name: Plugin and marketplace validate
        run: |
          claude plugin validate --strict ./qa-warden
          claude plugin validate --strict .
